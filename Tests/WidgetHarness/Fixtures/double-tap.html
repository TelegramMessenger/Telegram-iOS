<!-- Double tap (sdk-v1 §5.5, decided as on message buttons): #button handles taps, so each tap there is the widget's at
     once and asks to open a link (the readout's openLink), and a double tap there is two taps; #empty handles nothing,
     so a double tap there is the bubble's quick reaction. -->
<style>
  body { margin: 0; }
  #button { display: block; width: 100%; height: 100px; margin: 0; border: 0; background: #8cf; }
  #empty { height: 100px; background: #eee; }
</style>
<button id="button" onclick="TelegramWidget.openLink('https://example.org/tap')">button</button>
<div id="empty">empty</div>
