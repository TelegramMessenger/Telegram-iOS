<!-- Resize anchor (widget-sandbox v0.1.3): 'bottom', set at the start. Its first click grows it by 120 px, once; the
     chat keeps its bottom edge where it is. -->
<style>
  body { margin: 0; }
  #box { height: 100px; background: #8cf; }
  #more { display: none; height: 120px; background: #fc8; }
</style>
<div id="box">grows, bottom stays</div>
<div id="more"></div>
<script>
  TelegramWidget.setResizeAnchor('bottom');
  document.addEventListener('click', () => { document.getElementById('more').style.display = 'block'; }, { once: true });
</script>
