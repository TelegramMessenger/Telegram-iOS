<!-- Resize anchor (widget-sandbox v0.1.3): 'top', set at the start. Its first click shrinks it by 120 px, once; at the
     chat's bottom the chat stays at its bottom (and the list never shows space below the newest message), so its top
     moves down. -->
<style>
  body { margin: 0; }
  #box { height: 100px; background: #8cf; }
  #more { height: 120px; background: #fc8; }
</style>
<div id="box">shrinks, top stays</div>
<div id="more"></div>
<script>
  TelegramWidget.setResizeAnchor('top');
  document.addEventListener('click', () => { document.getElementById('more').style.display = 'none'; }, { once: true });
</script>
