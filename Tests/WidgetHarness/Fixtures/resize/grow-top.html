<!-- Resize anchor (widget-sandbox v0.1.3): 'top', set at the start. Its first click grows it by 120 px, once; off the
     chat's bottom the chat keeps its top edge where it is, at the bottom it grows upward. -->
<style>
  body { margin: 0; }
  #box { height: 100px; background: #8cf; }
  #more { display: none; height: 120px; background: #fc8; }
</style>
<div id="box">grows, top stays</div>
<div id="more"></div>
<script>
  TelegramWidget.setResizeAnchor('top');
  document.addEventListener('click', () => { document.getElementById('more').style.display = 'block'; }, { once: true });
</script>
