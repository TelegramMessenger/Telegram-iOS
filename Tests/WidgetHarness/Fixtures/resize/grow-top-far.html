<!-- Resize anchor (widget-sandbox v0.1.3): 'top', set at the start. Its first click grows it by 480 px, once: at the
     chat's bottom, from low enough on the screen, it grows upward until its top reaches the screen's top inset, and the
     rest downward. -->
<style>
  body { margin: 0; }
  #box { height: 100px; background: #8cf; }
  #more { display: none; height: 480px; background: #fc8; }
</style>
<div id="box">grows far, up to the top inset</div>
<div id="more"></div>
<script>
  TelegramWidget.setResizeAnchor('top');
  document.addEventListener('click', () => { document.getElementById('more').style.display = 'block'; }, { once: true });
</script>
