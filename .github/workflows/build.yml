name: Build Talogram IPA

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talogram-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check build environment
        run: |
          xcodebuild -version
          EXPECTED_XCODE="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          ACTUAL_XCODE="$(xcodebuild -version | awk 'NR == 1 {print $2}')"
          if [ "$ACTUAL_XCODE" != "$EXPECTED_XCODE" ]; then
            echo "::error::This project requires Xcode $EXPECTED_XCODE, but the runner has Xcode $ACTUAL_XCODE."
            exit 1
          fi
          python3 --version
          git submodule status
          if git submodule status --recursive | grep -Eq '^[-+U]'; then
            echo "::error::One or more pinned Git submodules were not checked out correctly."
            exit 1
          fi

      - name: Generate fresh verification provisioning profiles
        run: |
          python3 build-system/Make/Make.py \
            generate-verification-profiles \
            --configurationPath build-system/appstore-configuration.json \
            --codesigningInformationPath build-system/fake-codesigning \
            --destination build/verification-codesigning/profiles \
            --extendExpiration
          mkdir -p build/verification-codesigning/certs
          cp build-system/fake-codesigning/certs/* build/verification-codesigning/certs/

      - name: Build IPA for iPASide signing
        run: |
          python3 build-system/Make/Make.py \
            --cacheDir "$HOME/telegram-bazel-cache" \
            build \
            --configurationPath build-system/appstore-configuration.json \
            --codesigningInformationPath build/verification-codesigning \
            --buildNumber "$GITHUB_RUN_NUMBER" \
            --configuration release_arm64 \
            --outputBuildArtifactsPath build/artifacts

      - name: Verify IPA package
        run: |
          test -s build/artifacts/Telegram.ipa
          unzip -t build/artifacts/Telegram.ipa
          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT
          unzip -q build/artifacts/Telegram.ipa -d "$TEMP_DIR"
          APP_PATH="$(find "$TEMP_DIR/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"

      - name: Upload IPA for iPASide
        uses: actions/upload-artifact@v4
        with:
          name: Talogram-IPA-for-iPASide
          path: build/artifacts/Telegram.ipa
          if-no-files-found: error
          retention-days: 7
