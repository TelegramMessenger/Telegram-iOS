# Bazel URL rewriter (--downloader_config).
#
# GitHub's /archive/ endpoints redirect to codeload.github.com, but the
# redirecting endpoint regularly answers 502/504 on CI runners while codeload
# itself keeps working.  codeload serves exactly the same bytes (verified
# against the pinned SHA-256 of bats-core v1.10.0 and flatbuffers v24.12.23),
# so fetch archives from codeload directly.
#
# Patterns are matched against the URL without its scheme and must match the
# whole URL, as documented by Bazel's UrlRewriterConfig.

rewrite github.com/([^/]+)/([^/]+)/archive/(.+)\.tar\.gz codeload.github.com/$1/$2/tar.gz/$3
rewrite github.com/([^/]+)/([^/]+)/archive/(.+)\.zip codeload.github.com/$1/$2/zip/$3
